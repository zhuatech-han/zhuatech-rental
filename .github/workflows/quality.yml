name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Backend format, tests and package
        working-directory: backend
        run: mvn -B spotless:check test package
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend quality
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Public artifact checks
        run: python3 scripts/release-check.py
      - name: Compose and diff check
        env:
          MYSQL_ROOT_PASSWORD: '${{ secrets.TEST_MYSQL_ROOT_PASSWORD }}'
          DATABASE_PASSWORD: '${{ secrets.TEST_DATABASE_PASSWORD }}'
          ADMIN_PASSWORD: '${{ secrets.TEST_ADMIN_PASSWORD }}'
        run: |
          # Configuration validation does not require publishing or production credentials.
          export MYSQL_ROOT_PASSWORD="${MYSQL_ROOT_PASSWORD:-$(openssl rand -hex 24)}"
          export DATABASE_PASSWORD="${DATABASE_PASSWORD:-$(openssl rand -hex 24)}"
          export ADMIN_PASSWORD="${ADMIN_PASSWORD:-QaA9$(openssl rand -hex 20)}"
          docker compose config --quiet
          git diff --check
